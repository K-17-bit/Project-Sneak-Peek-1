<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080808;
      color: #ddd;
      font-family: "Courier New", monospace;
    }

    body {
      display: grid;
      place-items: center;
      position: relative;
    }

    /* Very subtle screen texture — no images. */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .07;
      background: repeating-linear-gradient(
        0deg,
        transparent 0,
        transparent 3px,
        #fff 4px
      );
      mix-blend-mode: screen;
    }

    .box {
      width: min(420px, 88vw);
      padding: 38px 32px;
      border: 1px solid #292929;
      background: #0b0b0b;
      box-shadow: 0 0 30px rgba(255,255,255,.025);
      text-align: center;
      position: relative;
    }

    .box::after {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      top: -1px;
      height: 1px;
      background: #555;
      opacity: .35;
      animation: flicker 3.5s infinite;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 17px;
      font-weight: normal;
      letter-spacing: 5px;
      text-transform: uppercase;
      position: relative;
    }

    h1::before,
    h1::after {
      content: "ACCESS";
      position: absolute;
      inset: 0;
      opacity: 0;
    }

    h1::before {
      color: #777;
      animation: glitch 4s infinite;
    }

    h1::after {
      color: #444;
      animation: glitch 4s infinite reverse;
    }

    p {
      margin: 0 0 24px;
      color: #666;
      font-size: 12px;
      letter-spacing: 1px;
    }

    input {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #303030;
      outline: none;
      background: #070707;
      color: #ddd;
      font: inherit;
      text-align: center;
      letter-spacing: 4px;
      transition: border .2s, box-shadow .2s;
    }

    input:focus {
      border-color: #666;
      box-shadow: 0 0 12px rgba(255,255,255,.04);
    }

    button {
      margin-top: 12px;
      width: 100%;
      padding: 11px;
      border: 1px solid #333;
      background: #111;
      color: #aaa;
      font: inherit;
      cursor: pointer;
      letter-spacing: 2px;
    }

    button:hover {
      background: #171717;
      color: #eee;
    }

    #message {
      min-height: 18px;
      margin-top: 15px;
      color: #555;
      font-size: 11px;
    }

    #music {
      margin-top: 9px;
      width: auto;
      padding: 6px 10px;
      font-size: 9px;
      letter-spacing: 1px;
      color: #555;
      background: transparent;
      border-color: #222;
    }

    #music:hover {
      color: #aaa;
      border-color: #444;
    }

    #symbols {
      display: none;
      margin-top: 25px;
      font-size: 38px;
      letter-spacing: 12px;
      filter: grayscale(.15);
      animation: appear .7s ease-out;
    }

    #symbols span {
      display: inline-block;
      animation: float 2.8s ease-in-out infinite;
    }

    #symbols span:nth-child(2) { animation-delay: .35s; }
    #symbols span:nth-child(3) { animation-delay: .7s; }

    .hint {
      position: fixed;
      bottom: 14px;
      color: #252525;
      font-size: 9px;
      letter-spacing: 2px;
    }

    @keyframes glitch {
      0%, 92%, 100% { opacity: 0; transform: translate(0); }
      93% { opacity: .5; transform: translate(-2px, 1px); }
      95% { opacity: .35; transform: translate(2px, -1px); }
    }

    @keyframes flicker {
      0%, 88%, 91%, 100% { opacity: .25; }
      89% { opacity: .65; }
      90% { opacity: .1; }
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
  </style>
</head>
<body>
  <main class="box">
    <h1>ACCESS</h1>
    <p>enter the password</p>

    <input id="password" type="password" autocomplete="off" spellcheck="false" aria-label="Password">
    <button id="submit">ENTER</button>

    <div id="message"></div>

    <button id="music" type="button">SOUND: OFF</button>

    <div id="symbols" aria-label="Symbols">
      <span>🕐</span><span>🃏</span><span>🎮</span>
    </div>
  </main>

  <div class="hint">SYSTEM // WAITING</div>

  <script>
    const input = document.getElementById("password");
    const button = document.getElementById("submit");
    const message = document.getElementById("message");
    const symbols = document.getElementById("symbols");

    function checkPassword() {
      if (input.value === "LCE") {
        symbols.style.display = "block";
        message.textContent = "";
      } else {
        symbols.style.display = "none";
        message.textContent = "ACCESS DENIED";
      }
    }

    button.addEventListener("click", checkPassword);

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") checkPassword();
    });

    // Soft procedural ambience; no external music file is needed.
    const musicButton = document.getElementById("music");
    let audioContext = null;
    let master = null;
    let drone = null;
    let lfo = null;

    function startAmbience() {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();

      master = audioContext.createGain();
      master.gain.value = 0.14;
      master.connect(audioContext.destination);

      drone = audioContext.createOscillator();
      const droneGain = audioContext.createGain();
      drone.type = "sine";
      drone.frequency.value = 55;
      droneGain.gain.value = 0.12;

      lfo = audioContext.createOscillator();
      const lfoGain = audioContext.createGain();
      lfo.frequency.value = 0.08;
      lfoGain.gain.value = 5;
      lfo.connect(lfoGain);
      lfoGain.connect(drone.frequency);

      drone.connect(droneGain);
      droneGain.connect(master);

      drone.start();
      lfo.start();
      musicButton.textContent = "SOUND: ON";
    }

    function stopAmbience() {
      if (!audioContext) return;

      master.gain.setTargetAtTime(0, audioContext.currentTime, 0.08);

      setTimeout(() => {
        try {
          drone.stop();
          lfo.stop();
          audioContext.close();
        } catch {}
        audioContext = null;
      }, 300);

      musicButton.textContent = "SOUND: OFF";
    }

    musicButton.addEventListener("click", () => {
      if (audioContext) stopAmbience();
      else startAmbience();
    });
  </script>
</body>
</html>
